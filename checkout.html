{% extends "base.html" %}{% block content %}<h1>Checkout</h1><form class="form" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Full name<input name="customer_name" required maxlength="80"></label><label>Phone number<input name="phone" required maxlength="20" placeholder="097..."></label><label>Delivery address<input name="address" required maxlength="250" placeholder="Area / street, Serenje"></label><label>Payment method<select name="payment_method" required><option>MTN Money</option><option>Airtel Money</option><option>Cash</option></select></label><p class="notice">For now, the order is recorded as Pending. Live MTN/Airtel payment processing will be connected after merchant/gateway onboarding.</p><button class="btn">Place order</button></form>{% endblock %}

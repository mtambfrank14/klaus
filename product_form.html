{% extends "base.html" %}{% block content %}<div class="form"><h1>{{"Edit" if product else "Add"}} Product</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name<input name="name" value="{{product.name if product else ''}}" required maxlength="100"></label><label>Price (K)<input type="number" min="0" name="price" value="{{product.price if product else 0}}" required></label><label>Category<input name="category" value="{{product.category if product else ''}}" required></label><label>Size<input name="size" value="{{product.size if product else ''}}" required></label><label>Colour<input name="colour" value="{{product.colour if product else ''}}" required></label><label>Stock<input type="number" min="0" name="stock" value="{{product.stock if product else 0}}" required></label><label>Product image<input type="file" name="image" accept=".jpg,.jpeg,.png,.webp"></label><button class="btn">Save product</button></form></div>{% endblock %}
